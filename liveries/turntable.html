<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>Turntable</title>
<!-- A baked 3D model (D307) on the app's turntable, in a page's dialog: ?m= names the model, only under /liveries/. -->
<style>
  /* Its own sky (the card's golden hour, as on the page): a frame without its own color scheme on a dark page is
     painted white. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  html { background: linear-gradient(180deg, #5f5d8c 0%, #8a7596 45%, #c4918a 80%, #d9a585 100%) fixed; }
  p { position: fixed; inset: auto 0 45% 0; margin: 0; text-align: center; color: #f3ede4; font: 16px/1.5 Inter, -apple-system, sans-serif; }
</style>
<script src="/liveries/turntable_3d.js"></script>
</head>
<body>
<script>
  const say = (text) => { const p = document.createElement("p"); p.textContent = text; document.body.appendChild(p); };
  const url = new URLSearchParams(location.search).get("m") || "";
  if (!/^\/liveries\/[\w\/.-]+\.glb$/.test(url) || url.includes("..")) say("There's no model here.");
  else BakedTurntable.start({ url, pixelRatio: 2 })
    .then((out) => { if (out === "fallback") say("This browser can't show 3D."); })
    .catch(() => say("This browser can't show 3D."));
</script>
</body>
</html>
